<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #222;
            color: white;
            padding: 40px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>SIGN UP</h2>

    <form action="/user" method="POST">
        <input type="email" name="email"
               placeholder="Email address" required>

        <input type="password" name="password"
               placeholder="Password" required>

        <button type="submit">회원가입</button>
    </form>
</div>
</body>
</html>
