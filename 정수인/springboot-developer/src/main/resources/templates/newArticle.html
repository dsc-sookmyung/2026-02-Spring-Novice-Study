
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>블로그 글 작성</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>

<div class="p-5 mb-5 text-center bg-light">
    <h1 class="mb-3">My Blog</h1>
    <h4 class="mb-3">블로그에 오신 것을 환영합니다.</h4>
</div>

<div class="container">
    <input type="hidden" id="article-id" th:value="${article.id}">

    <div class="mb-3">
        <label for="title" class="form-label">제목</label>
        <input type="text" class="form-control" id="title"
               th:value="${article.title}">
    </div>

    <div class="mb-3">
        <label for="content" class="form-label">내용</label>
        <textarea class="form-control" id="content" rows="10"
                  th:text="${article.content}"></textarea>
    </div>

    <button th:if="${article.id} != null" type="button"
            id="modify-btn" class="btn btn-primary btn-sm">수정</button>

    <button th:if="${article.id} == null" type="button"
            id="create-btn" class="btn btn-primary btn-sm">등록</button>
</div>

<script src="/js/token.js"></script>
<script src="/js/article.js"></script>

</body>
</html>
